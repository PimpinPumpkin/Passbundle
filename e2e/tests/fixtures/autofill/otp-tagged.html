<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Two-step verification</title></head>
  <body>
    <!-- A well-built code field: autocomplete and inputmode say what it is. -->
    <form action="/signed-in.html" method="post">
      <label for="code">Verification code</label>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" />
      <button type="submit">Verify</button>
    </form>
  </body>
</html>
