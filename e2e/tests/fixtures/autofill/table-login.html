<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <!-- An older site's sign-in laid out in a table: the words are in the
         cells beside the fields, with no label elements. -->
    <form action="/signed-in.html" method="post">
      <table>
        <tr>
          <td>User name:</td>
          <td><input name="uid" type="text" size="20" /></td>
        </tr>
        <tr>
          <td>Password:</td>
          <td><input name="pwd" type="password" size="20" /></td>
        </tr>
        <tr>
          <td></td>
          <td><input type="submit" value="Log in" /></td>
        </tr>
      </table>
    </form>
  </body>
</html>
