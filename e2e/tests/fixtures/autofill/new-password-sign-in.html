<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <!-- A sign-in that marks its password field as a new password, to keep
         browsers from filling it. One password field, a Sign in button, and
         nothing to confirm: it's a sign-in all the same. -->
    <form action="/signed-in.html" method="post">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="off" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" />
      <button type="submit">Sign in</button>
    </form>
  </body>
</html>
