<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <!-- A show-password toggle: pressed before filling, it turns the password
         field into a text field. It's still the password field. -->
    <form action="/signed-in.html" method="post">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" />
      <button type="button" id="toggle" aria-pressed="false">Show</button>
      <button type="submit">Sign in</button>
    </form>
    <script>
      const toggle = document.getElementById("toggle");
      const field = document.getElementById("password");
      toggle.addEventListener("click", () => {
        const show = field.type === "password";
        field.type = show ? "text" : "password";
        toggle.textContent = show ? "Hide" : "Show";
        toggle.setAttribute("aria-pressed", String(show));
      });
    </script>
  </body>
</html>
