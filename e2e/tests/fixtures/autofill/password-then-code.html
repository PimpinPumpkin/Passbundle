<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <!-- After the password, the same form asks for a code from an
         authenticator app, in place: the first step's fields are hidden, not
         removed, and the cursor goes to the code. Nothing of the login belongs
         in the code field. -->
    <form action="/signed-in.html" method="post">
      <div id="step1">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" />
        <button type="button" id="sign-in">Sign in</button>
      </div>
      <div id="step2" hidden>
        <label for="code">Code from your authenticator app</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" />
        <button type="submit">Verify</button>
      </div>
    </form>
    <script>
      document.getElementById("sign-in").addEventListener("click", () => {
        document.getElementById("step1").hidden = true;
        document.getElementById("step2").hidden = false;
        document.getElementById("code").focus();
      });
    </script>
  </body>
</html>
