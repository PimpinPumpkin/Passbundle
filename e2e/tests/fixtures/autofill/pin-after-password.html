<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Online banking</title>
    <style>
      .row {
        margin-bottom: 12px;
      }
      .row label {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- A sign-in that asks for the password and then a PIN in a masked box
         of its own. Only the box's label and its number keypad say it's a
         PIN: its id and name say nothing, and it has no maxlength. The saved
         password goes in the password field only. -->
    <form action="/signed-in.html" method="post">
      <h1>Online banking</h1>
      <div class="row">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" />
      </div>
      <div class="row">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" />
      </div>
      <div class="row">
        <label for="extra">PIN</label>
        <input id="extra" name="extra" type="password" inputmode="numeric" />
      </div>
      <button type="submit">Sign in</button>
    </form>
  </body>
</html>
