<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <!-- A bank's sign-in that asks for a password and a separate four-digit
         security PIN, both masked, in one form. The saved password goes in
         the password field only. -->
    <form action="/signed-in.html" method="post">
      <h1>Sign in</h1>
      <label for="customer">Customer ID</label>
      <input id="customer" name="customer" type="text" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" />
      <label for="pin">Security PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" maxlength="4" />
      <button type="submit">Sign in</button>
    </form>
  </body>
</html>
