# Command-line tool releases (docs/cli.md): the `passbundle` program, built
# from a commit of passbundle-clients (apps/cli, branded), packed with Node.js
# inside it by tools/cli/pack.sh, for macOS (Apple silicon and Intel), Linux
# (x64 and arm64), and 64-bit Windows, and published as a release of this
# repository. Started by hand, from main. A pull request that changes this
# file or tools/cli builds every platform and checks the archives the same
# way, with the linked passbundle-clients branch if there is one, and stops
# there: no key, nothing published.
#
# Four jobs, as the desktop apps' releases in passbundle-apps
# (linux-release.yml, windows-release.yml), so a signing key and the token
# that can publish never meet the build's own code (npm packages' install
# scripts, webpack, pkg):
#
#   plan     the version, the commit, and the notes; read-only
#   build    the program on each platform, packed; no secrets, read-only
#   sign     the only job that may hold the key: checks the archives, writes
#            their manifest and SHA256SUMS with jq and coreutils, and signs
#            the manifest with OpenSSL and this file's own shell, running
#            nothing from any repository; read-only
#   publish  the only job that can write: gh release create; no secrets
#
# Tagged cli-v<major>.<minor>.<build>: the major and minor are
# tools/cli/package.json's, and the build is this workflow's run number,
# which only goes up. Renaming this file starts the run number at 1 again:
# add an offset to BUILD then, or the versions go backwards. A release is
# never marked as the latest release of this repository.
#
# The manifest is signed with the CLI release key, an Ed25519 key of its own
# (not the desktop apps' update key), over "PassBundle CLI release v1\n" and
# the manifest's bytes. Its private half is the PASSBUNDLE_CLI_RELEASE_KEY
# secret of this repository, and its public half is pinned below
# (CLI_RELEASE_PUBLIC_KEY); the owner makes both (docs/cli.md, "The CLI
# release key"). Until the secret is there, releases carry the manifest and
# SHA256SUMS without manifest.json.sig, and say so. A secret with no pinned
# public key, or another key, stops the release. The tool doesn't update
# itself, so nothing reads the signature yet but people checking a download
# (docs/cli.md, "Checking a download").
name: CLI release

on:
  workflow_dispatch:
    inputs:
      clients-ref:
        description: The passbundle-clients branch or commit to build
        type: string
        default: keykeeper
  pull_request:
    paths:
      - .github/workflows/cli-release.yml
      - tools/cli/**

permissions: {}

concurrency:
  # Releases one at a time; a pull request's check by itself, the newest only.
  group: cli-release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The CLI release key's public half (the PASSBUNDLE_CLI_RELEASE_KEY
  # secret's), as 64 hex digits: a manifest is signed only with the key it
  # names. Empty until the owner makes the key (docs/cli.md, "The CLI release
  # key"); docs/cli.md lists the same value for checking downloads.
  CLI_RELEASE_PUBLIC_KEY: ""
  # The Node.js that builds and packs the tool. The program carries its own
  # (pkg's, tools/cli/package-lock.json).
  BUILD_NODE_VERSION: 24.21.0

jobs:
  plan:
    name: What to release
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      release: ${{ steps.plan.outputs.release }}
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Which passbundle-clients to build
        id: ref
        env:
          INPUT: ${{ inputs.clients-ref }}
          BRANCH: ${{ github.head_ref }}
        run: |
          # A pull request builds the clients' branch of the same name, if
          # there is one (as tier 1 does), else keykeeper.
          ref=${INPUT:-keykeeper}
          if [ -n "$BRANCH" ] &&
            git ls-remote --exit-code --heads https://github.com/PimpinPumpkin/passbundle-clients.git "refs/heads/$BRANCH" > /dev/null; then
            ref=$BRANCH
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/cli
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PimpinPumpkin/passbundle-clients
          ref: ${{ steps.ref.outputs.ref }}
          path: clients
          # The history, for the notes.
          fetch-depth: 0
          persist-credentials: false
      - name: The version, and whether there's anything new
        id: plan
        env:
          BUILD: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git -C clients rev-parse HEAD)
          # A release is built only from what's merged into keykeeper (whose
          # tier 1 runs passed), whatever ref it was asked for.
          if [ "$GITHUB_EVENT_NAME" != pull_request ] &&
            ! git -C clients merge-base --is-ancestor "$sha" refs/remotes/origin/keykeeper; then
            echo "passbundle-clients ${sha:0:10} isn't on keykeeper: releases are built only from what's merged there." >&2
            exit 1
          fi
          base=$(jq -r '.version | capture("^(?<v>[0-9]+\\.[0-9]+)\\.").v' tools/cli/package.json)
          [ -n "$base" ] && [ "$base" != null ] || { echo "No version in tools/cli/package.json." >&2; exit 1; }
          version="$base.$BUILD"
          # The newest CLI release, by build number, and the commit it was built from.
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' |
            grep '^cli-v' | awk -F. '{ print $NF "\t" $0 }' | sort -n | tail -1 | cut -f2 || true)
          last_sha=
          if [ -n "$last" ]; then
            gh release download "$last" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir "$RUNNER_TEMP/last"
            last_sha=$(jq -r .commit "$RUNNER_TEMP/last/manifest.json")
          fi
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "last=$last"
            echo "last_sha=$last_sha"
          } >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "A pull request's check: building passbundle-clients ${sha:0:10} as $version, publishing nothing." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$sha" = "$last_sha" ]; then
            echo "${sha:0:10} is already $last: nothing new to release." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing passbundle-clients ${sha:0:10} as $version (the last release is ${last:-none})." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The notes, the command-line tool's changes since the last release
        id: notes
        if: steps.plan.outputs.release == 'true'
        env:
          SHA: ${{ steps.plan.outputs.sha }}
          VERSION: ${{ steps.plan.outputs.version }}
          LAST: ${{ steps.plan.outputs.last }}
          LAST_SHA: ${{ steps.plan.outputs.last_sha }}
        run: |
          if [ -n "$LAST_SHA" ] && git -C clients merge-base --is-ancestor "$LAST_SHA" "$SHA"; then
            since="since ${LAST#cli-v}"
            changes=$(git -C clients log --no-merges --format='- %s' "$LAST_SHA..$SHA" -- apps/cli)
          elif [ -n "$LAST_SHA" ]; then
            since="since ${LAST#cli-v}"
            changes="- Built from a branch that doesn't follow ${LAST}'s commit"
          else
            since="in this first release"
            changes="- The passbundle command-line tool, for scripts on Mac, Linux, and Windows"
          fi
          notes=$(
            echo "What's new $since:"
            echo
            echo "${changes:-- Changes in the code the command-line tool shares with the web vault and the extension}"
            echo
            echo "Built from PimpinPumpkin/passbundle-clients at $SHA."
            echo
            echo "Files: passbundle-$VERSION-macos-arm64.tar.gz is for Macs with Apple silicon and passbundle-$VERSION-macos-x64.tar.gz for Intel Macs; passbundle-$VERSION-linux-x64.tar.gz and passbundle-$VERSION-linux-arm64.tar.gz for 64-bit Linux; passbundle-$VERSION-windows-x64.zip for 64-bit Windows. Each holds the passbundle program, its license, and where its source is. manifest.json names them with their sizes and SHA-256, and SHA256SUMS lists every file's SHA-256."
            echo
            echo "How to install it, sign in, and use it in scripts: https://github.com/PimpinPumpkin/Passbundle/blob/main/docs/cli.md. It doesn't update itself: \`passbundle update\` says where to get the newest version."
          )
          echo "$notes"
          end="NOTES_$(od -An -N12 -tx1 /dev/urandom | tr -d ' \n')"
          printf 'notes<<%s\n%s\n%s\n' "$end" "$notes" "$end" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ needs.plan.outputs.version }} (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - platform: macos-arm64
            pack: macos-arm64
            runner: macos-15
            archive: tar.gz
          - platform: macos-x64
            pack: macos-x64
            runner: macos-15-intel
            archive: tar.gz
          - platform: linux-x64
            pack: linux-x64
            runner: ubuntu-24.04
            archive: tar.gz
          - platform: linux-arm64
            pack: linux-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - platform: windows-x64
            pack: win-x64
            runner: windows-2025
            archive: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # No secrets here, and nothing it can write: this is where the build's
    # own code runs.
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/cli
          path: meta
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PimpinPumpkin/passbundle-clients
          ref: ${{ needs.plan.outputs.sha }}
          path: clients
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.BUILD_NODE_VERSION }}
      - name: Install dependencies
        run: |
          (cd clients && npm ci --no-audit --no-fund)
          (cd meta/tools/cli && npm ci --no-audit --no-fund --ignore-scripts)
      - name: Build and pack it
        run: meta/tools/cli/pack.sh clients "$VERSION" "${{ matrix.pack }}" stage
      - name: Its license and source, and the archive
        run: |
          cp clients/LICENSE.txt stage/LICENSE.txt
          {
            echo "PassBundle CLI $VERSION, for $PLATFORM."
            echo
            echo "Free software under the GNU General Public License, version 3 (LICENSE.txt),"
            echo "based on the open-source Bitwarden command-line tool. Its source:"
            echo "https://github.com/PimpinPumpkin/passbundle-clients/tree/$SHA/apps/cli"
            echo
            echo "How to use it: https://github.com/PimpinPumpkin/Passbundle/blob/main/docs/cli.md"
          } > stage/README.txt
          mkdir dist
          name="passbundle-$VERSION-$PLATFORM"
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd stage && 7z a -tzip "../dist/$name.zip" passbundle.exe LICENSE.txt README.txt > /dev/null)
          elif tar --version | grep -q GNU; then
            tar --owner=0 --group=0 --numeric-owner -czf "dist/$name.tar.gz" -C stage passbundle LICENSE.txt README.txt
          else
            # macOS's tar: no AppleDouble files for extended attributes.
            COPYFILE_DISABLE=1 tar --uid 0 --gid 0 --numeric-owner --no-xattrs -czf "dist/$name.tar.gz" -C stage passbundle LICENSE.txt README.txt
          fi
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passbundle-cli-${{ matrix.platform }}-${{ needs.plan.outputs.version }}-unsigned
          path: dist
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign ${{ needs.plan.outputs.version }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Once the owner puts the CLI release key in a "cli-release" environment
    # (with a rule that only main may use it), this job, and only this one,
    # takes it:
    # environment: cli-release
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    # No checkout: nothing from any repository runs here, only the runner's
    # own tools (tar, unzip, jq, OpenSSL) and this file's own shell.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: passbundle-cli-*-${{ needs.plan.outputs.version }}-unsigned
          path: unsigned
          merge-multiple: true
      # Everything about the archives, before the key is anywhere near.
      - name: Check the archives, and write their manifest
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          mkdir dist
          files='[]'
          for platform in macos-arm64 macos-x64 linux-x64 linux-arm64 windows-x64; do
            if [ "$platform" = windows-x64 ]; then
              archive="passbundle-$VERSION-$platform.zip"
              listed=$(unzip -Z1 "unsigned/$archive" | sort | tr '\n' ' ')
              expected="LICENSE.txt README.txt passbundle.exe "
            else
              archive="passbundle-$VERSION-$platform.tar.gz"
              listed=$(tar -tzf "unsigned/$archive" | sort | tr '\n' ' ')
              expected="LICENSE.txt README.txt passbundle "
              # Plain files only.
              if tar -tvzf "unsigned/$archive" | grep -v '^-'; then
                echo "$archive holds something that isn't a file." >&2
                exit 1
              fi
            fi
            if [ "$listed" != "$expected" ]; then
              echo "$archive holds $listed, not $expected" >&2
              exit 1
            fi
            cp "unsigned/$archive" dist/
            files=$(jq -c --arg name "$archive" --arg platform "$platform" \
              --argjson size "$(stat -c %s "dist/$archive")" --arg sha "$(sha256sum "dist/$archive" | cut -d' ' -f1)" \
              '. + [{name: $name, platform: $platform, size: $size, sha256: $sha}]' <<< "$files")
          done
          jq -n -c --arg tag "cli-v$VERSION" --arg version "$VERSION" --arg commit "$SHA" --arg notes "$NOTES" \
            --argjson files "$files" \
            '{format: 1, app: "com.passbundle.cli", tag: $tag, version: $version, commit: $commit, notes: $notes,
              files: $files}' > dist/manifest.json
          cat dist/manifest.json
      - name: The CLI release key, from the repository's secrets
        id: key
        # Never for a pull request's check.
        if: needs.plan.outputs.publish == 'true'
        env:
          RELEASE_KEY: ${{ secrets.PASSBUNDLE_CLI_RELEASE_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo "::notice::No CLI release key in this repository's secrets: the manifest goes out unsigned, with SHA256SUMS."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$CLI_RELEASE_PUBLIC_KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The CLI release key is in the secrets, but this workflow pins no public key for it (CLI_RELEASE_PUBLIC_KEY): see docs/cli.md, \"The CLI release key\"." >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$RELEASE_KEY" > "$RUNNER_TEMP/release-key.pem"
          # The pinned key, and no other.
          public=$(openssl pkey -in "$RUNNER_TEMP/release-key.pem" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          if [ "$public" != "$CLI_RELEASE_PUBLIC_KEY" ]; then
            rm -f "$RUNNER_TEMP/release-key.pem"
            echo "The secret isn't the CLI release key this workflow pins." >&2
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Sign the manifest, and check the signature
        if: steps.key.outputs.signed == 'true'
        run: |
          { printf 'PassBundle CLI release v1\n'; cat dist/manifest.json; } > "$RUNNER_TEMP/signed"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release-key.pem" -rawin -in "$RUNNER_TEMP/signed" -out "$RUNNER_TEMP/signature"
          rm -f "$RUNNER_TEMP/release-key.pem"
          openssl base64 -A -in "$RUNNER_TEMP/signature" > dist/manifest.json.sig
          # Checked with the pinned public key alone, as docs/cli.md says to.
          printf "$(printf '302a300506032b6570032100%s' "$CLI_RELEASE_PUBLIC_KEY" | sed 's/../\\x&/g')" > "$RUNNER_TEMP/public.der"
          openssl base64 -d -A -in dist/manifest.json.sig > "$RUNNER_TEMP/check"
          openssl pkeyutl -verify -pubin -keyform DER -inkey "$RUNNER_TEMP/public.der" -rawin \
            -in "$RUNNER_TEMP/signed" -sigfile "$RUNNER_TEMP/check"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key.pem"
      - name: SHA256SUMS
        run: |
          (cd dist && sha256sum passbundle-* manifest.json $(ls manifest.json.sig 2>/dev/null) > SHA256SUMS && cat SHA256SUMS)
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passbundle-cli-${{ needs.plan.outputs.version }}
          path: dist
          if-no-files-found: error
          retention-days: 7
    outputs:
      signed: ${{ steps.key.outputs.signed }}

  publish:
    name: Publish ${{ needs.plan.outputs.version }}
    needs: [plan, sign]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that can write, with no secrets but its token, and no
    # code from any repository.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: passbundle-cli-${{ needs.plan.outputs.version }}
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          NOTES: ${{ needs.plan.outputs.notes }}
          SIGNED: ${{ needs.sign.outputs.signed }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          {
            printf '%s\n' "$NOTES"
            echo
            if [ "$SIGNED" = true ]; then
              echo "manifest.json.sig is the manifest's Ed25519 signature with the CLI release key (public key $CLI_RELEASE_PUBLIC_KEY), over \"PassBundle CLI release v1\" and a newline, then the manifest: docs/cli.md, \"Checking a download\"."
            else
              echo "This release's manifest isn't signed: the CLI release key isn't made yet. Check a download against SHA256SUMS."
            fi
          } > "$RUNNER_TEMP/notes.md"
          # Never this repository's latest release.
          gh release create "cli-v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PassBundle CLI $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest=false \
            dist/*
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/cli-v$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
