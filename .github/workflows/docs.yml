# The Markdown docs (DESIGN.md, docs/, the READMEs): every relative link
# points at a file that exists (tools/check-doc-links.mjs). Tier 1 skips
# Markdown-only changes, so this is the check a docs change gets.
name: Docs

on:
  push:
    branches: [main]
    paths: ["**.md", "tools/check-doc-links.mjs", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**.md", "tools/check-doc-links.mjs", ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  links:
    name: Links in the docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node tools/check-doc-links.mjs
