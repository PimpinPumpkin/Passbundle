# Tier 2 in Google Chrome: passkeys in the browser extension in Chrome's
# stable channel as a person has it (the runner's own Google Chrome, with a
# window, on a virtual display), with the branded extension loaded unpacked,
# against the test server and web vault as tier 1 starts them and a site whose
# checks we didn't write (e2e/chrome; DESIGN.md, "Passkeys").
#
# A workflow of its own: the other tier 2 workflows install PassBundle on a
# disposable machine and build our apps for it, on installer changes; this
# builds the server and the clients as tier 1 does, and runs on changes to
# its own tests.
# Nightly, on changes to its files (pull requests included), and on demand.
name: Tier 2 (Chrome)

on:
  pull_request:
    paths:
      - "e2e/chrome/**"
      - "e2e/playwright.chrome.config.ts"
      - "e2e/package-lock.json"
      - ".github/workflows/tier2-chrome.yml"
  push:
    branches: [main]
    paths:
      - "e2e/chrome/**"
      - "e2e/playwright.chrome.config.ts"
      - "e2e/package-lock.json"
      - ".github/workflows/tier2-chrome.yml"
  schedule:
    - cron: "11 8 * * *"
  workflow_dispatch:
    inputs:
      server-ref:
        description: The passbundle-server branch to build the server from
        default: keykeeper
      clients-ref:
        description: The passbundle-clients branch to build the web vault and the extension from
        default: keykeeper

permissions:
  contents: read

jobs:
  refs:
    name: Linked branches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      server: ${{ steps.pick.outputs.server }}
      clients: ${{ steps.pick.outputs.clients }}
    steps:
      - name: Pick each repo's branch
        id: pick
        env:
          BRANCH: ${{ github.head_ref }}
          SERVER_IN: ${{ inputs.server-ref }}
          CLIENTS_IN: ${{ inputs.clients-ref }}
        run: |
          # On demand, the ones asked for. For a pull request, the branch of
          # the same name where that repo has one, as tier 1 pairs them;
          # otherwise the repo's keykeeper branch.
          linked() {
            if [ -n "$BRANCH" ] &&
              git ls-remote --exit-code --heads "https://github.com/PimpinPumpkin/$1.git" "refs/heads/$BRANCH" > /dev/null; then
              echo "$BRANCH"
            else
              echo keykeeper
            fi
          }
          server=${SERVER_IN:-$(linked passbundle-server)}
          clients=${CLIENTS_IN:-$(linked passbundle-clients)}
          {
            echo "server=$server"
            echo "clients=$clients"
          } >> "$GITHUB_OUTPUT"
          echo "Server: $server. Clients: $clients."

  server:
    name: Server build
    needs: refs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PimpinPumpkin/passbundle-server
          ref: ${{ needs.refs.outputs.server }}
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libssl-dev pkg-config
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # SQLite only: tier 1 checks PostgreSQL.
      - name: Build
        run: cargo build --features sqlite
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: target/debug/vaultwarden
          if-no-files-found: error
          retention-days: 3

  # On runners of their own, as in tier 1: side by side, the two builds need
  # more memory than a runner has.
  web-vault:
    name: Branded web vault
    needs: refs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PimpinPumpkin/passbundle-clients
          ref: ${{ needs.refs.outputs.clients }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply branding
        run: node brand/apply.mjs
      - name: Build the web vault
        working-directory: apps/web
        run: npm run build:oss:selfhost:prod
      - name: Collect the build
        run: |
          mkdir -p out
          cp -r apps/web/build out/web-vault
          cp brand/brand.json out/brand.json
          find out -name '*.map' -delete
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clients
          path: out
          retention-days: 3

  chrome-extension:
    name: Branded Chrome extension
    needs: refs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PimpinPumpkin/passbundle-clients
          ref: ${{ needs.refs.outputs.clients }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply branding
        run: node brand/apply.mjs
      - name: Build the Chrome extension
        working-directory: apps/browser
        run: npm run build:prod:chrome
      - name: Collect the build
        run: |
          mkdir -p out
          cp -r apps/browser/build out/extension-chrome
          find out -name '*.map' -delete
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-extension
          path: out
          retention-days: 3

  passkeys:
    name: Passkeys in Google Chrome
    needs: [server, web-vault, chrome-extension]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server
          path: build/server
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clients
          path: build/clients
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome-extension
          path: build/clients
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # Not Playwright's Chromium: the runner's own Google Chrome, stable
      # channel, which Playwright's channel "chrome" starts.
      - name: Install test dependencies and a virtual display
        working-directory: e2e
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb && npm ci --no-audit --no-fund
      - name: Which Chrome
        run: /opt/google/chrome/chrome --version
      - name: Passkeys on a site whose checks we didn't write
        working-directory: e2e
        env:
          KK_SERVER_BIN: ${{ github.workspace }}/build/server/vaultwarden
          KK_WEB_VAULT: ${{ github.workspace }}/build/clients/web-vault
          KK_EXTENSION: ${{ github.workspace }}/build/clients/extension-chrome
          KK_BRAND: ${{ github.workspace }}/build/clients/brand.json
          KK_SERVER_LOG: ${{ github.workspace }}/e2e/server-log/server.log
          KK_CHROME_HEADED: "1"
        run: |
          mkdir -p server-log && chmod +x "$KK_SERVER_BIN"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npx playwright test -c playwright.chrome.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tier2-chrome-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/server-log
          retention-days: 14
