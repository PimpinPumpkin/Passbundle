# Release: PassBundle's server and web vault as one container image, built for
# production (the optimized server, for SQLite and PostgreSQL, and the branded
# web vault), then started and checked like a fresh install by
# deploy/smoke.sh. Runs for every push to main, for pull requests that change
# the image, and by hand. A pull request whose branch name also exists in the
# server or clients repo is built with that branch there, as Tier 1 does, so a
# change to the image and the server it needs pass together. The image is kept
# as a build artifact; pushing it to a registry comes with the hosted service.
# See deploy/README.md.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "site/**"]
  pull_request:
    paths: ["deploy/**", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      server-ref:
        description: passbundle-server branch, tag, or commit
        type: string
        default: keykeeper
      clients-ref:
        description: passbundle-clients branch, tag, or commit
        type: string
        default: keykeeper

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refs:
    name: Linked branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.pick.outputs.server }}
      clients: ${{ steps.pick.outputs.clients }}
    steps:
      - name: Pick each repo's branch
        id: pick
        env:
          BRANCH: ${{ github.head_ref }}
          SERVER_IN: ${{ inputs.server-ref }}
          CLIENTS_IN: ${{ inputs.clients-ref }}
        run: |
          # What was asked for by hand; else the pull request's branch name,
          # where that repo has such a branch; else its keykeeper branch.
          linked() {
            if [ -n "$BRANCH" ] &&
              git ls-remote --exit-code --heads "https://github.com/PimpinPumpkin/$1.git" "refs/heads/$BRANCH" > /dev/null; then
              echo "$BRANCH"
            else
              echo keykeeper
            fi
          }
          server=${SERVER_IN:-$(linked passbundle-server)}
          clients=${CLIENTS_IN:-$(linked passbundle-clients)}
          {
            echo "server=$server"
            echo "clients=$clients"
          } >> "$GITHUB_OUTPUT"
          echo "Server: $server. Clients: $clients."

  server:
    name: Optimized server
    needs: refs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PimpinPumpkin/passbundle-server
          ref: ${{ needs.refs.outputs.server }}
          persist-credentials: false
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libssl-dev pkg-config libpq-dev
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release
      # S3-compatible storage for attachments and Send files (deploy/README.md).
      - name: Build
        run: cargo build --locked --release --features sqlite,postgresql,s3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-release
          path: target/release/vaultwarden
          retention-days: 3

  web:
    name: Branded web vault
    needs: refs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PimpinPumpkin/passbundle-clients
          ref: ${{ needs.refs.outputs.clients }}
          persist-credentials: false
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply branding
        run: node brand/apply.mjs
      - name: Build the web vault
        working-directory: apps/web
        run: npm run build:oss:selfhost:prod
      - name: Drop source maps
        run: find apps/web/build -name '*.map' -delete
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-vault-release
          path: apps/web/build
          retention-days: 3

  image:
    name: Image, built and smoke-tested
    needs: [server, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-release
          path: deploy/context
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-vault-release
          path: deploy/context/web-vault
      - name: Build the image
        env:
          SERVER: ${{ needs.server.outputs.commit }}
          CLIENTS: ${{ needs.web.outputs.commit }}
        run: |
          mv deploy/context/vaultwarden deploy/context/passbundle-server
          docker build -f deploy/Dockerfile -t passbundle:release \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "com.passbundle.server-commit=${SERVER}" \
            --label "com.passbundle.clients-commit=${CLIENTS}" \
            deploy/context
          docker image inspect passbundle:release --format 'Image size: {{.Size}} bytes'
      - name: Smoke test, on SQLite and PostgreSQL, and the client's address behind a tunnel
        run: deploy/smoke.sh passbundle:release
      - name: Save the image
        run: docker save passbundle:release | gzip > passbundle-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: passbundle-image.tar.gz
          retention-days: 14
