# Tier 2 on Windows: the RMM-style install on a disposable machine, with the
# desktop agent built from passbundle-apps, then real Chrome and Edge confirm
# they picked up the policies. Nightly, on installer changes, and on demand.
name: Tier 2 (Windows)

on:
  pull_request:
    paths:
      - "installer/windows/**"
      - "e2e/windows/**"
      - "e2e/playwright.windows.config.ts"
      - ".github/workflows/tier2-windows.yml"
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "e2e/windows/**"
      - "e2e/playwright.windows.config.ts"
      - ".github/workflows/tier2-windows.yml"
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      apps-ref:
        description: The passbundle-apps branch to build the desktop agent from
        default: main

permissions:
  contents: read

jobs:
  install:
    name: RMM-style install and browser policy check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Which passbundle-apps branch
        id: apps
        shell: bash
        env:
          INPUT: ${{ inputs.apps-ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          # On demand, the one asked for; for a pull request, a linked branch of the same name if there is one.
          ref="${INPUT:-main}"
          if [ -z "$INPUT" ] && [ -n "$HEAD" ] && git ls-remote --exit-code --heads https://github.com/PimpinPumpkin/passbundle-apps "$HEAD" > /dev/null; then
            ref="$HEAD"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "passbundle-apps: $ref"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PimpinPumpkin/passbundle-apps
          ref: ${{ steps.apps.outputs.ref }}
          path: apps
          persist-credentials: false
      - name: Install the desktop agent's and the core's Rust toolchains
        shell: bash
        run: (cd apps/agent && rustup toolchain install) && (cd apps/core && rustup toolchain install)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            apps/agent
            apps/core
      - name: Build the desktop agent, next to the install script as an RMM package has it
        working-directory: apps/agent
        shell: pwsh
        run: |
          cargo build --locked --release
          New-Item -ItemType Directory -Force ../../installer/windows/agent | Out-Null
          Copy-Item target/release/passbundle-agent.exe, target/release/passbundle-agent-host.exe ../../installer/windows/agent/
      - name: Build the app (the core and Flutter), next to the install script too
        shell: bash
        run: |
          (cd apps/core && cargo build --locked --release --features ffi)
          # Flutter at the release passbundle-apps pins (its .github/workflows/ci.yml).
          git clone --quiet --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 5fc346839b5d0eef006ed8404392afb4dfae428d
          flutter="$RUNNER_TEMP/flutter/bin/flutter.bat"
          "$flutter" config --no-analytics
          (cd apps/app && "$flutter" build windows --release)
          mkdir -p installer/windows/app
          cp -r apps/app/build/windows/x64/runner/Release/. installer/windows/app/
          cp apps/core/target/release/passbundle_core.dll installer/windows/app/
          ls installer/windows/app
      - name: Install as an RMM would, and check the registry
        shell: pwsh
        run: ./installer/windows/tests/Test-Install.ps1
      - name: Run the install script again, and with another build, while the agent, its browser helper, and the app run
        shell: pwsh
        run: ./installer/windows/tests/Test-Rerun.ps1
      - name: Two test releases of the agent, its host, and the app, signed with a throwaway key
        # Two releases of the same build: 0.1.1, which the next step installs,
        # and 0.1.2, which a stand-in for the update site serves. Each has a
        # test build of the agent with the throwaway key and the stand-in
        # compiled in (passbundle-apps, agent/README.md, "Updates"), which
        # release builds refuse.
        shell: bash
        run: |
          if [ ! -f apps/agent/examples/test-release.rs ]; then
            echo "This passbundle-apps has no test releases for the update task: its checks don't run."
            exit 0
          fi
          test=installer/windows/update-test
          testw=$(cygpath -w "$PWD/$test")
          site=http://127.0.0.1:8719/agent
          mkdir -p "$test/site/agent"
          (cd apps/agent && cargo run --locked --example test-release -- key "$testw/key")
          key=$(cat "$test/key/key.pub")
          (cd apps/agent && PB_TEST_UPDATE_KEY="$key" PB_TEST_UPDATE_SOURCE="$site" cargo build --locked --features test-update)
          # Each says its version, and has a file the other doesn't.
          for version in 0.1.1 0.1.2; do
            bundle="$test/bundle-$version"
            mkdir -p "$bundle"
            cp -R apps/app/build/windows/x64/runner/Release/. "$bundle/"
            echo "$version" > "$bundle/update-test.txt"
            echo "$version" > "$bundle/only-$version.txt"
            apps/tools/release-folder.sh "$bundle" apps/core/target/release apps/agent/target/debug "$test/$version" "$version" windows-x64
          done
          python apps/tools/zip-release.py "$test/0.1.2" "$test/site/agent/PassBundle-0.1.2-windows-x64.zip"
          (cd apps/agent && cargo run --locked --example test-release -- sign "$testw/key" "$testw/site/agent/PassBundle-0.1.2-windows-x64.zip" 0.1.2 "$site" "$testw/site/agent")
      - name: The update task puts 0.1.2 in place of 0.1.1, end to end (diagnostics, three ways)
        shell: pwsh
        run: |
          # DIAGNOSTICS (not for merging): as on main; with the download left
          # changed, so no update goes in; and with the site out of reach for
          # the changed download's run.
          $unmet = 0
          foreach ($scenario in "as-on-main", "no-update", "site-down") {
            $env:PB_DIAG = $scenario
            Write-Host "===== $scenario"
            $global:LASTEXITCODE = 0
            $stopped = $null
            try {
              $out = @(& ./installer/windows/tests/Test-AgentUpdate.ps1 *>&1 | ForEach-Object { $line = "$_"; Write-Host $line; $line })
            } catch { $stopped = "$_"; Write-Host "===== $scenario stopped: $_" }
            $code = $LASTEXITCODE
            $text = $out -join "`n"
            $fails = @($out | Where-Object { $_ -like "FAIL  *" }).Count
            $checks = @($out | Where-Object { $_ -like "ok    *" -or $_ -like "FAIL  *" }).Count
            Write-Host "===== $scenario ended with $code; $checks checks reported, $fails failed; stopped: $([bool] $stopped)"
            $want = switch ($scenario) {
              "as-on-main" { $code -eq 0 -and $fails -eq 0 -and $text -like "*all checks passed*" -and
                  $text -like "*(it said: Update failed: the download doesn't match the release's SHA-256)*" }
              "no-update" { -not $stopped -and $code -eq 1 -and $text -like "*check(s) failed*" -and
                  @($out | Where-Object { $_ -like "*Everyone can run the new*" }).Count -eq 3 -and
                  @($out | Where-Object { $_ -like "*and the update task's folder*" }).Count -eq 1 }
              "site-down" { -not $stopped -and $code -eq 1 -and $fails -eq 1 -and
                  @($out | Where-Object { $_ -like "FAIL  A download that isn't the signed one is refused*" }).Count -eq 1 -and
                  $text -like "*(it said: Update failed: couldn't reach the update site*" }
            }
            Write-Host "===== $scenario as expected: $want"
            if (-not $want) { $unmet++ }
          }
          Write-Host "===== $unmet of 3 not as expected"
          exit $unmet
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install test dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Chrome and Edge report the policies
        working-directory: e2e
        run: npx playwright test -c playwright.windows.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tier2-windows-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
