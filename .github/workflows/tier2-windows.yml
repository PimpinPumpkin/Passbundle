# Tier 2 on Windows: the RMM-style install on a disposable machine, with the
# desktop agent built from passbundle-apps, then real Chrome and Edge confirm
# they picked up the policies. Nightly, on installer changes, and on demand.
name: Tier 2 (Windows)

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "e2e/windows/**"
      - "e2e/playwright.windows.config.ts"
      - ".github/workflows/tier2-windows.yml"
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      apps-ref:
        description: The passbundle-apps branch to build the desktop agent from
        default: main

permissions:
  contents: read

jobs:
  install:
    name: RMM-style install and browser policy check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PimpinPumpkin/passbundle-apps
          ref: ${{ inputs.apps-ref || 'main' }}
          path: apps
          persist-credentials: false
      - name: Install the desktop agent's and the core's Rust toolchains
        shell: bash
        run: (cd apps/agent && rustup toolchain install) && (cd apps/core && rustup toolchain install)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            apps/agent
            apps/core
      - name: Build the desktop agent, next to the install script as an RMM package has it
        working-directory: apps/agent
        shell: pwsh
        run: |
          cargo build --locked --release
          New-Item -ItemType Directory -Force ../../installer/windows/agent | Out-Null
          Copy-Item target/release/passbundle-agent.exe, target/release/passbundle-agent-host.exe ../../installer/windows/agent/
      - name: Build the app (the core and Flutter), next to the install script too
        shell: bash
        run: |
          (cd apps/core && cargo build --locked --release --features ffi)
          # Flutter at the release passbundle-apps pins (its .github/workflows/ci.yml).
          git clone --quiet --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 5fc346839b5d0eef006ed8404392afb4dfae428d
          flutter="$RUNNER_TEMP/flutter/bin/flutter.bat"
          "$flutter" config --no-analytics
          (cd apps/app && "$flutter" build windows --release)
          mkdir -p installer/windows/app
          cp -r apps/app/build/windows/x64/runner/Release/. installer/windows/app/
          cp apps/core/target/release/passbundle_core.dll installer/windows/app/
          ls installer/windows/app
      - name: Install as an RMM would, and check the registry
        shell: pwsh
        run: ./installer/windows/tests/Test-Install.ps1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install test dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Chrome and Edge report the policies
        working-directory: e2e
        run: npx playwright test -c playwright.windows.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tier2-windows-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
