# Tier 2 on Windows: the RMM-style install on a disposable machine, then real
# Chrome and Edge confirm they picked up the policies. Nightly, on installer
# changes, and on demand.
name: Tier 2 (Windows)

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "e2e/windows/**"
      - "e2e/playwright.windows.config.ts"
      - ".github/workflows/tier2-windows.yml"
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: RMM-style install and browser policy check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install as an RMM would, and check the registry
        shell: pwsh
        run: ./installer/windows/tests/Test-Install.ps1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install test dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Chrome and Edge report the policies
        working-directory: e2e
        run: npx playwright test -c playwright.windows.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tier2-windows-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
