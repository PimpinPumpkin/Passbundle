# Builds and checks passbundle.com (site/) on every change to it. Deploying is
# manual: site/deploy.sh.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**"]
  pull_request:
    paths: ["site/**"]

permissions:
  contents: read

jobs:
  check:
    name: Build and check the site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node site/build.mjs && node site/check.mjs
