# Tier 1: every commit, fully repeatable. Builds the server and the branded
# clients from their keykeeper branches (or the commits passed in by a fork's
# CI), then runs the end-to-end suite against them. A pull request whose
# branch name also exists in another of the three repos is tested with that
# branch there, so a change that spans repos passes before any part merges.
name: Tier 1

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
  workflow_call:
    inputs:
      clients-ref:
        type: string
        default: keykeeper
      server-ref:
        type: string
        default: keykeeper

permissions:
  contents: read

concurrency:
  group: tier1-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refs:
    name: Linked branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.pick.outputs.server }}
      clients: ${{ steps.pick.outputs.clients }}
      meta: ${{ steps.pick.outputs.meta }}
    steps:
      - name: Pick each repo's branch
        id: pick
        env:
          BRANCH: ${{ github.head_ref }}
          CALLER: ${{ github.repository }}
          SERVER_IN: ${{ inputs.server-ref }}
          CLIENTS_IN: ${{ inputs.clients-ref }}
        run: |
          # The pull request's branch name, where that repo has such a branch;
          # otherwise the repo's main branch.
          linked() {
            if [ -n "$BRANCH" ] &&
              git ls-remote --exit-code --heads "https://github.com/PimpinPumpkin/$1.git" "refs/heads/$BRANCH" > /dev/null; then
              echo "$BRANCH"
            else
              echo "$2"
            fi
          }
          # Repository names compare without case (the meta repo is "Passbundle").
          caller=$(echo "$CALLER" | tr '[:upper:]' '[:lower:]')
          if [ "$caller" = pimpinpumpkin/passbundle-server ]; then
            server=${SERVER_IN:-keykeeper}
          else
            server=$(linked passbundle-server keykeeper)
          fi
          if [ "$caller" = pimpinpumpkin/passbundle-clients ]; then
            clients=${CLIENTS_IN:-keykeeper}
          else
            clients=$(linked passbundle-clients keykeeper)
          fi
          # The meta repo's own runs test their own commit (checkout's default).
          meta=
          if [ "$caller" != pimpinpumpkin/passbundle ]; then
            meta=$(linked Passbundle main)
          fi
          {
            echo "server=$server"
            echo "clients=$clients"
            echo "meta=$meta"
          } >> "$GITHUB_OUTPUT"
          echo "Server: $server. Clients: $clients. Tests: ${meta:-this commit}."

  server:
    name: Server tests and build
    needs: refs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PimpinPumpkin/passbundle-server
          ref: ${{ needs.refs.outputs.server }}
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libssl-dev pkg-config libpq-dev
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # One binary for both supported databases (SQLite and PostgreSQL); the
      # database URL picks which one at startup.
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --features sqlite,postgresql
      - name: Unit tests
        run: cargo test --features sqlite,postgresql
      - name: Build
        run: cargo build --features sqlite,postgresql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: target/debug/vaultwarden
          retention-days: 3

  clients:
    name: Branded web vault and extension
    needs: refs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PimpinPumpkin/passbundle-clients
          ref: ${{ needs.refs.outputs.clients }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply branding
        run: node brand/apply.mjs
      - name: Build the web vault and Chrome extension
        # At the same time; each mostly uses one core.
        run: |
          (cd apps/web && npm run build:oss:selfhost:prod) > "$RUNNER_TEMP/web.log" 2>&1 &
          web=$!
          (cd apps/browser && npm run build:prod:chrome) > "$RUNNER_TEMP/chrome.log" 2>&1 &
          chrome=$!
          status=0
          wait "$web" || { echo "::error::The web vault build failed"; status=1; }
          wait "$chrome" || { echo "::error::The Chrome extension build failed"; status=1; }
          echo "::group::Web vault build" && cat "$RUNNER_TEMP/web.log" && echo "::endgroup::"
          echo "::group::Chrome extension build" && cat "$RUNNER_TEMP/chrome.log" && echo "::endgroup::"
          exit "$status"
      - name: Collect builds
        run: |
          mkdir -p out
          cp -r apps/web/build out/web-vault
          cp -r apps/browser/build out/extension-chrome
          cp brand/brand.json out/brand.json
          find out -name '*.map' -delete
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clients
          path: out
          retention-days: 3

  clients-unit:
    name: Clients unit tests
    needs: refs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PimpinPumpkin/passbundle-clients
          ref: ${{ needs.refs.outputs.clients }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Upstream unit tests for every file we changed
        run: |
          base=$(cat .keykeeper-base)
          git fetch --no-tags --depth=1 origin "refs/tags/$base:refs/tags/$base"
          # A changed component template counts as a change to its component,
          # since jest only follows imports.
          git diff --name-only "$base" HEAD -- 'apps/*.ts' 'libs/*.ts' 'apps/*.html' 'libs/*.html' |
            sed 's/\.html$/.ts/' | sort -u |
            while read -r file; do if [ -f "$file" ]; then echo "$file"; fi; done > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then
            xargs npx jest --ci --findRelatedTests < "$RUNNER_TEMP/changed.txt"
          fi

  other-browsers:
    name: Edge and Firefox extensions
    needs: refs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PimpinPumpkin/passbundle-clients
          ref: ${{ needs.refs.outputs.clients }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply branding
        run: node brand/apply.mjs
      - name: Build Edge extension
        working-directory: apps/browser
        run: npm run build:prod:edge && mv build ../../edge-build
      - name: Build Firefox extension
        working-directory: apps/browser
        run: npm run build:prod:firefox
      - name: Lint the Firefox build with Mozilla's add-on checks
        working-directory: apps/browser
        run: npx --yes web-ext@10.7.0 lint --source-dir build --self-hosted
      - name: Check both manifests carry our name
        run: |
          node -e '
            const fs = require("fs");
            const brand = JSON.parse(fs.readFileSync("brand/brand.json", "utf8"));
            for (const dir of ["edge-build", "apps/browser/build"]) {
              const msgs = JSON.parse(fs.readFileSync(dir + "/_locales/en/messages.json", "utf8"));
              const name = msgs.extName.message;
              if (name !== brand.nameFull) throw new Error(dir + ": extension name is " + name);
              console.log(dir + ": " + name);
            }'

  e2e:
    name: End-to-end (${{ matrix.part }})
    needs: [refs, server, clients]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Five machines share the suite, each with its own servers: the API
    # tests split across two, and the browser and email tests across three.
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: API 1 of 2
            args: --project=api --shard=1/2
          - part: API 2 of 2
            args: --project=api --shard=2/2
          - part: browser 1 of 3
            args: --project=chromium --project=mail --shard=1/3
          - part: browser 2 of 3
            args: --project=chromium --project=mail --shard=2/3
          - part: browser 3 of 3
            args: --project=chromium --project=mail --shard=3/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PimpinPumpkin/Passbundle
          ref: ${{ needs.refs.outputs.meta }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server
          path: build/server
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clients
          path: build/clients
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install test dependencies
        working-directory: e2e
        run: sudo apt-get install -y --no-install-recommends libpq5 && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: e2e
        env:
          KK_SERVER_BIN: ${{ github.workspace }}/build/server/vaultwarden
          KK_WEB_VAULT: ${{ github.workspace }}/build/clients/web-vault
          KK_EXTENSION: ${{ github.workspace }}/build/clients/extension-chrome
          KK_BRAND: ${{ github.workspace }}/build/clients/brand.json
          KK_SERVER_LOG: ${{ github.workspace }}/e2e/server-log/server.log
        run: mkdir -p server-log && chmod +x "$KK_SERVER_BIN" && npx playwright test ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report-${{ strategy.job-index }}
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/server-log
          retention-days: 14

  api-postgres:
    name: API tests on PostgreSQL (${{ matrix.shard }}/2)
    needs: [refs, server, clients]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keykeeper
          POSTGRES_PASSWORD: keykeeper
          POSTGRES_DB: keykeeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keykeeper"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PimpinPumpkin/Passbundle
          ref: ${{ needs.refs.outputs.meta }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server
          path: build/server
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clients
          path: build/clients
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install test dependencies
        working-directory: e2e
        run: sudo apt-get install -y --no-install-recommends libpq5 && npm ci --no-audit --no-fund
      - name: Run API tests
        working-directory: e2e
        env:
          KK_SERVER_BIN: ${{ github.workspace }}/build/server/vaultwarden
          KK_WEB_VAULT: ${{ github.workspace }}/build/clients/web-vault
          KK_BRAND: ${{ github.workspace }}/build/clients/brand.json
          KK_DATABASE_URL: postgresql://keykeeper:keykeeper@localhost:5432/keykeeper
          KK_SERVER_LOG: ${{ github.workspace }}/e2e/server-log/server.log
        run: mkdir -p server-log && chmod +x "$KK_SERVER_BIN" && npx playwright test --project=api --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: api-postgres-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/server-log
          retention-days: 14
